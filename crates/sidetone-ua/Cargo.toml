[package]
name = "sidetone-ua"
description = "Test SIP user agent with configurable behavior profiles and in-process capture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
sidetone-core.workspace = true
serde.workspace = true
serde_json.workspace = true
md-5 = "0.10"
socket2 = "0.5"
hickory-resolver = "0.24"
cpal = { version = "0.15", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
opus = "0.4"
gsm-sys = "0.0.2"
g729-sys = "0.3"
libloading = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
sha2 = "0.10"
dimpl = { version = "0.7", default-features = false, features = ["rust-crypto"] }
rustls-pemfile = "2"
p12-keystore = "0.4.1"
x509-parser = "0.18.1"

[build-dependencies]
cc = "1"

[features]
default = ["audio"]
audio = ["dep:cpal"]
